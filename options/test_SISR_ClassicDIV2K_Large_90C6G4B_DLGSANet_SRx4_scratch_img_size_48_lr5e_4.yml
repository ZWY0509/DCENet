# network structures
# Large Setting: 90C-6G-4B-2FFNExpansion
network_g:
  type: DCENetSR
  upscale: 4
  in_chans: 3
  dim: 60
  groups: 6
  blocks: 2
  buildblock_type: 'dual'
  # window_size: 7
  # idynamic_num_heads: 6
  # idynamic_ffn_type: 'GDFN'
  # idynamic_ffn_expansion_factor: 2.
  # idynamic: true
  restormer_num_heads: 6
  restormer_ffn_type: 'PCFN'
  restormer_ffn_expansion_factor: 2.
  tlc_flag: true
  tlc_kernel: 96    # using tlc during validation
  activation: 'relu'
  body_norm: false
  img_range: 1.
  upsampler: 'pixelshuffledirect'
  use_pam: true     # Added this parameter for our DCENetSR


# path
path:
  pretrain_network_g: ./experiments/sandstone2Dx4C15wanzheng/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true

# dist training settings
dist_params:
  backend: nccl
  port: 29500