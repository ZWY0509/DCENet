# general settings
name: test_SISR_ClassicDIV2K_Large_90C6G4B_DLGSANet_SRx4_scratch_img_size_48_lr5e_4
# BASE Setting: 90C-6G-4B-2FFNExpansion
model_type: SRModel
scale: 4
num_gpu: auto
manual_seed: 0

# dataset and data loader settings
datasets:
  val_1:
    name: sandstone2D
    type: PairedImageDataset
    dataroot_gt: ./RockDataSet/MyData/DeepRockSR_test/sandstone2D/sandstone2D_test_HR
    dataroot_lq: ./RockDataSet/MyData/DeepRockSR_test/sandstone2D/sandstone2D_test_LR_default_X4
    filename_tmpl: '{}'
    io_backend:
      type: disk

